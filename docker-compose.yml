version: '3.8'

services:
  # ==========================================
  # 1. Aplikasi Laravel (PHP-FPM)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projekkp_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-projekkp}
      DB_USERNAME: ${DB_USERNAME:-projekkp_user}
      DB_PASSWORD: ${DB_PASSWORD:-projekkp_pass}
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - projekkp_net

  # ==========================================
  # 2. Web Server (Nginx)
  # ==========================================
  web:
    image: nginx:alpine
    container_name: projekkp_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - public_data:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - projekkp_net

  # ==========================================
  # 3. Database (MariaDB / MySQL)
  # ==========================================
  db:
    image: mariadb:10.11
    container_name: projekkp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-projekkp}
      MYSQL_USER: ${DB_USERNAME:-projekkp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-projekkp_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - projekkp_net

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
  public_data:
    driver: local

networks:
  projekkp_net:
    driver: bridge

